server.port=8085

spring.application.name=api-gateway

# Route to AuthService running on port 8080
spring.cloud.gateway.routes[0].id=auth-service-route
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/health, /users/**, /auth/**, /api/auth/**, /api/user/**

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# JWT Configuration
spring.app.jwt.public-key-path=keys/public.pem
spring.app.jwtCookieName=accessToken

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cloud.gateway.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.routes[0].filters[0].args.redis-rate-limiter.requestedTokens=1
spring.cloud.gateway.routes[0].filters[0].args.key-resolver=#{@ipKeyResolver}
